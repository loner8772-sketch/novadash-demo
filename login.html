  <div class="min-h-screen flex items-center justify-center px-6 relative overflow-hidden">
    <div class="orb w-96 h-96 bg-brand-600/25 -top-32 -left-20"></div>
    <div class="orb w-72 h-72 bg-violet-600/15 bottom-0 right-0"></div>

    <div class="w-full max-w-sm relative z-10">
      <div class="flex items-center gap-2.5 justify-center mb-8">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-brand-400 to-brand-700">
          <i data-lucide="layout-grid" class="w-5 h-5 text-white"></i>
        </span>
        <span class="font-display font-extrabold text-xl text-white">Nova<span class="text-brand-400">Dash</span></span>
      </div>

      <div class="card p-8">
        <h1 class="font-display font-bold text-2xl text-white text-center">Sign in</h1>
        <p class="text-gray-500 text-sm text-center mt-2 mb-7">Access your workspace dashboard.</p>

        <form class="space-y-4" onsubmit="event.preventDefault();location.href='index.html'">
          <div>
            <label for="dl-email" class="block text-sm font-medium text-gray-300 mb-2">Email address</label>
            <input id="dl-email" type="email" placeholder="you@company.com" class="input-field">
          </div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="dl-pass" class="block text-sm font-medium text-gray-300">Password</label>
              <a href="#" class="text-xs text-brand-400 hover:text-brand-300">Forgot?</a>
            </div>
            <input id="dl-pass" type="password" placeholder="••••••••" class="input-field">
          </div>
          <button type="submit" class="w-full py-3 rounded-lg bg-brand-500 text-white font-semibold text-sm hover:bg-brand-400 transition-colors">Sign in</button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">This is a UI demo &mdash; no real authentication is wired up.</p>
      </div>
